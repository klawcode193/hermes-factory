# Chief of Staff — orchestrator only. No secrets.
# Telegram uses platform_toolsets. List kanban by name or the gateway
# session has no hands. Do not replace a live chief config that already
# has telegram chat ids — merge these keys into it.

toolsets:
  - kanban
  - memory
  - clarify

platform_toolsets:
  cli:
    - kanban
    - memory
    - clarify
  telegram:
    - kanban
    - memory
    - clarify

agent:
  disabled_toolsets:
    - file
    - terminal
    - coding
    - browser
    - code_execution
    - computer_use
    - image_gen
    - video_gen
    - cronjob
    - delegation

kanban:
  dispatch_in_gateway: true
  auto_decompose: true
  auto_subscribe_on_create: true
  orchestrator_profile: chief

memory:
  memory_enabled: true
  user_profile_enabled: true
